<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1110">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Padel Lab">
<title>Pádel Coach: biblioteca y semana</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap">
<style>
:root{--bg:#0c1110;--surf:#17211b;--ink:#eef5ef;--mut:#9aaa9e;--line:#2a3a2f;--blue:#c5ff53;--blue-t:#26361f;--ball:#c5ff53;--ball-ink:#152012;--danger:#ff8a7a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Inter,system-ui,sans-serif;font-weight:800;margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:34px 34px 0;margin-bottom:22px}
header h1{font-size:32px;margin:6px 0}
header .tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surf);border-radius:8px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--ball);border-color:var(--ball);color:#152012;font-weight:800}
.layout{display:grid;grid-template-columns:minmax(300px,360px) 1fr;gap:18px;padding:0 34px 34px;align-items:start}
aside{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px;position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}
aside h2{font-size:18px;margin:2px 4px 10px}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-bottom:10px}
details{border-top:1px solid var(--line)}
summary{cursor:pointer;padding:10px 4px;font-weight:600;display:flex;justify-content:space-between;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--mut);font-weight:400}
details[open] summary::after{content:"–"}
.count{color:var(--mut);font-weight:400;margin-left:6px}
.empty{color:var(--mut);padding:2px 4px 12px;font-size:14px}
.ex{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:8px;margin:0 0 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:grab}
.ex:active{cursor:grabbing}
.thumb{width:54px;height:72px;border-radius:6px;background:var(--surf);border:1px solid var(--line);object-fit:cover}
.nothumb{display:grid;place-items:center;color:var(--mut);font-size:24px;text-align:center}
.ex b{display:block;line-height:1.2}
.ex small{color:var(--mut);display:block}
.row{display:flex;gap:6px;margin-top:6px;align-items:center}
.row button,.row select{font-size:13px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surf)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.bar input{font:800 22px Inter,sans-serif;background:transparent;border:0;border-bottom:2px solid var(--ball);padding:2px 4px;min-width:240px;color:var(--ink)}
.day{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:220px;display:flex;flex-direction:column;gap:8px}
.day h3{font-size:15px}
.day .note{width:100%;border:0;border-bottom:1px dashed var(--line);background:transparent;padding:3px 0;font-size:14px}
.day.over{border-color:var(--ball);box-shadow:0 0 0 3px var(--ball)}
.slot{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:6px;border:1px solid var(--line);border-left:4px solid var(--ball);border-radius:8px;background:var(--bg)}
.slot .thumb{width:34px;height:46px}
.slot button{border:0;background:transparent;color:var(--mut);font-size:18px;padding:2px 6px}
.slot button:hover{color:var(--danger)}
.slot span{cursor:pointer;line-height:1.2;font-weight:500}
.hint{color:var(--mut);font-size:14px;margin:auto 0;text-align:center}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surf);color:var(--ink);padding:18px;max-width:min(680px,94vw);width:100%}
dialog::backdrop{background:rgba(5,12,20,.55)}
.detail{display:grid;grid-template-columns:220px 1fr;gap:18px}
.detail img{width:100%;border-radius:8px;border:1px solid var(--line)}
.detail h2{font-size:24px}
.detail p{margin:6px 0 12px}
.tag{display:inline-block;background:var(--ball);color:var(--ball-ink);border-radius:6px;padding:1px 8px;font-size:13px;font-weight:600}
form label{display:block;font-weight:600;margin:10px 0 3px}
form input,form textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
form .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.pv{max-height:150px;margin-top:8px;border-radius:6px;display:none}
.tools2{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tools2 button.on{background:var(--blue);border-color:var(--blue);color:#fff}
#edBoard{max-width:360px;margin:0 auto;touch-action:none;user-select:none;cursor:crosshair}
#edBoard svg{display:block;width:100%;height:auto;border-radius:12px}
.edhelp{color:var(--mut);font-size:14px;margin:0 0 10px}
.clock{font-weight:600;color:var(--mut)}
.wk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.wk b{font-family:Inter,sans-serif;font-size:15px;margin-left:6px}
.day h3 .dd{font:500 15px Inter,sans-serif;color:var(--mut)}
.day.today{border:2px solid var(--blue);box-shadow:0 0 0 3px var(--blue-t)}
.day.past{opacity:.72}
.tabs{display:flex;gap:6px;padding:10px 20px 0;background:var(--surf);border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:10px 16px;font-weight:600;color:var(--mut);border-bottom:3px solid transparent}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.view[hidden]{display:none!important}
.home,#viewStudents,#viewStats,#viewLib,#viewTrain,#viewTeam{padding:0 34px 34px}
.ttl{font-size:32px;margin:0 0 12px}
.mut{color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi span{color:var(--mut);font-size:14px;display:block}
.kpi b{font:700 42px/1.1 Inter,sans-serif;color:var(--blue)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.card,.panel{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:21px}
.card h3{font-size:18px;margin-bottom:8px}
.sess{display:flex;gap:12px;align-items:center;padding:8px;border-radius:10px;cursor:pointer}
.sess:hover{background:var(--bg)}
.sess small{display:block;color:var(--mut)}
.dt{width:48px;text-align:center;background:var(--blue-t);border-radius:10px;padding:4px 0;color:var(--blue)}
.dt b{display:block;font:700 22px/1 Inter,sans-serif}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dy{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.dy.now{background:var(--blue);color:#101810;border-color:var(--blue)}
.dy small{opacity:.8}.dy i{width:6px;height:6px;border-radius:50%}.dy i.dot{background:var(--ball)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 11px;font-size:14px}
.chip b{margin-left:6px;color:var(--blue)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#101810}
.mini{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;padding:6px 0;cursor:pointer}
.mini .thumb{width:40px;height:54px}
.pill{display:inline-block;--pc:#c026d3;color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,transparent);border-radius:6px;padding:0 8px;font-size:12px;font-weight:600}
.pill.c1{--pc:#0e9ab8}.pill.c2{--pc:#d9690a}.pill.c3{--pc:#2f9e5b}
.evo{display:grid;grid-template-columns:1fr 120px 52px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.evo small{display:block;color:var(--mut)}
.spark{width:120px;height:36px;color:var(--blue)}
.dl{font-weight:700;text-align:right}.up{color:#c5ff53}.down{color:var(--danger)}
.stg{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.st.off{opacity:.55}
.sth{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.sth small{color:var(--mut)}
.sk{display:grid;grid-template-columns:70px 1fr 44px;gap:8px;align-items:center;font-size:14px;margin-top:4px}
.bar2{height:8px;background:var(--bg);border-radius:6px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--blue)}
.row2{display:flex;gap:8px;margin-top:12px}
.rg{display:grid;grid-template-columns:90px 1fr 24px;gap:8px;align-items:center;margin:6px 0}
form select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.side{position:fixed;inset:0 auto 0 0;width:230px;background:#111a17;border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;gap:6px;z-index:15}
.side .logo{font-size:24px;font-weight:900;color:var(--ball);margin-bottom:34px}
.side button{border:0;background:transparent;text-align:left;padding:13px;border-radius:12px;color:#a7b5ab;font-weight:500}
.side button.on{background:var(--ball);color:#101810;font-weight:800}
.side .ver{margin-top:auto;font-size:12px;color:var(--mut);margin-bottom:0}
.mainw{margin-left:230px;max-width:1700px}
.sub{font-size:12px;color:#8eaa91;letter-spacing:.4px}
header p.clock{margin:0;font-weight:600;color:var(--mut)}
.heading{display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel h2{font-size:18px;margin:0 0 17px}
.pl{background:#2c3f2c;color:var(--ball);border-radius:99px;padding:5px 9px;font-size:11px;white-space:nowrap}
.ghost{border:1px solid #35473b;background:#1b2821;color:#e7f3e9;border-radius:10px;padding:7px 12px}
.kpi small{color:#a6b8a9}.kpi strong{display:block;font-size:32px;margin:12px 0 4px;font-weight:800}.kpi em{font-style:normal;color:var(--ball);font-size:12px}
.lay{display:grid;grid-template-columns:1.7fr 1fr;gap:18px;margin:18px 0}
.weekg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.dayc{background:#101914;border:1px solid #2d3c32;border-radius:12px;min-height:150px;padding:10px 7px;cursor:pointer}
.dayc.now{border-color:var(--ball)}.dayc b{display:block;font-size:12px;margin-bottom:10px}.dayc small{color:#9daf9f;display:block}
.session{position:relative;background:#304b31;border-left:3px solid var(--gc,var(--ball));border-radius:6px;padding:8px 22px 8px 8px;margin:6px 0;font-size:12px;overflow-wrap:anywhere}
.dayc .session{padding-right:6px}
.session span{display:block;color:var(--gc,var(--ball));font-weight:700}.session small{display:block;color:#9daf9f}
.session button{position:absolute;top:2px;right:4px;border:0;background:transparent;color:var(--mut);font-size:17px}
.listitem{border-bottom:1px solid #2b392f;padding:12px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar2{background:#304034}
.chart{display:flex;align-items:end;height:150px;gap:10px;border-bottom:1px solid #4b5d4c;padding:0 4px}
.chart div{flex:1;background:linear-gradient(#c5ff53,#477e4b);border-radius:6px 6px 0 0;min-height:4px}
.chartlabels{display:flex;justify-content:space-around;font-size:11px;color:#a8b7a9;margin-top:10px;text-transform:capitalize}
.exercises{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.exercise{padding:14px;background:#101914;border:1px solid #304033;border-radius:12px}
.exercise .thumb{display:block;width:44px;height:60px;margin-bottom:8px}
.exercise button{margin-top:10px;margin-right:6px}
.fm{display:inline-block;min-width:26px;text-align:center;border-radius:6px;padding:2px 7px;font-weight:800;font-size:12px;background:#3a463d;color:#e7f3e9}.fm.G{background:var(--ball);color:#101810}.fm.P{background:#ff8a7a;color:#2a0d09}
.gp{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;color:#101810;background:var(--gc,var(--ball));margin-left:6px}
.dtb{width:48px;flex:0 0 48px;text-align:center;background:#101914;border:1px solid #2d3c32;border-radius:10px;padding:5px 0}.dtb b{display:block;font-size:18px}.dtb small{color:var(--mut)}
.tr{align-items:flex-start;gap:14px}.tr .chips{margin-top:8px}.tr .row2{margin:0;flex-wrap:wrap}
.next b.big{font-size:28px;display:block;color:var(--ball);margin-bottom:4px}
.exercise .ico{font-size:34px;margin-bottom:8px}.exercise .ob{color:var(--mut);font-size:13px;margin:4px 0 0}
#viewDlg form{margin-top:16px;display:flex;justify-content:flex-end}
.bigico{font-size:96px;text-align:center;align-self:center}
.layout.libonly{grid-template-columns:1fr}.layout.libonly main{display:none}
.layout.libonly aside{position:static;max-height:none}
.layout.libonly details[open]{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 12px}
.layout.libonly summary,.layout.libonly .empty{grid-column:1/-1}
@media (max-width:1100px){.lay{grid-template-columns:1fr}}
@media (max-width:860px){.side{overflow-x:auto;inset:auto 0 0 0;width:auto;flex-direction:row;justify-content:space-around;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line)}.side .logo,.side .ver{display:none}.side button{flex:0 0 auto;text-align:center;padding:9px 10px;font-size:11px;white-space:nowrap}.mainw{margin-left:0;padding-bottom:76px}header{padding:20px 18px 0}.home,#viewStudents,#viewStats,#viewLib,#viewTrain,#viewTeam,.layout{padding:0 18px 24px}.weekg{overflow-x:auto;grid-template-columns:repeat(7,118px)}.exercises{grid-template-columns:1fr 1fr}}
@media (max-width:860px){.layout{grid-template-columns:1fr}aside{position:static;max-height:none}.detail{grid-template-columns:1fr}}
@media print{:root{--bg:#fff;--surf:#fff;--ink:#000;--mut:#444;--line:#999;--blue:#000;--ball:#bbb}.side,aside,header .tools,.slot button,.session button,.row,.hint{display:none!important}.mainw{margin:0}.layout{display:block}body{background:#fff;color:#000}.day{break-inside:avoid}}
#viewBoard{padding:0 34px 34px}
.pz{display:grid;grid-template-columns:1fr 280px;gap:18px;align-items:start}
.pz-tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pz-tools .btn.on{background:var(--ball);border-color:var(--ball);color:#152012;font-weight:800}
#pzBoard{touch-action:none;user-select:none;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
#pzBoard svg{display:block;width:100%;height:auto}
#pzBoard.rot{max-width:440px;margin:0 auto}
@media (max-width:1100px){.pz{grid-template-columns:1fr}}
@media (max-width:860px){#viewBoard{padding:0 14px 90px}}
.side button i{font-style:normal;margin-right:12px}
@media (max-width:860px){
.mainw{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
header{padding:16px 14px 0;margin-bottom:14px}header h1{font-size:24px}
header .tools{gap:6px}
.btn,.ghost{min-height:40px;font-size:13px}
input,select,textarea{font-size:16px!important}
.home,#viewStudents,#viewStats,#viewLib,#viewTrain,#viewTeam,.layout,#viewBoard{padding:0 14px 24px}
.layout main{order:-1}.board{grid-template-columns:1fr}.day{min-height:0}
.bar input{min-width:0;width:100%;font-size:20px!important}
dialog{width:calc(100vw - 20px);max-height:88vh;overflow:auto;padding:14px}
.side{gap:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.side button{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;padding:7px 6px;border-radius:10px}
.side button i{font-size:19px;margin:0;line-height:1}
.panel{padding:14px;border-radius:14px}
.pz-tools .btn{padding:8px 10px}
.exercises{grid-template-columns:1fr}
}
</style>
</head>
<body>
<nav class="side" id="tabs"><div class="logo">◈ PADEL LAB</div><button class="on" data-go="Home"><i>▦</i><span>Dashboard</span></button><button data-go="Lib"><i>◉</i><span>Biblioteca</span></button><button data-go="Plan"><i>▣</i><span>Planificador</span></button><button data-go="Train"><i>◷</i><span>Entrenamientos</span></button><button data-go="Board"><i>✎</i><span>Pizarra</span></button><button data-go="Students"><i>♙</i><span>Jugadores</span></button><p class="ver">COACH OS · v1.0</p></nav>
<div class="mainw">
<header>
  <div><div class="sub">TU CENTRO DE ENTRENAMIENTO</div><h1 id="pageT">Dashboard del entrenador</h1><p class="clock" id="clock"></p></div>
  <div class="tools">
    <button class="btn pri" id="sessBtn">＋ Crear entrenamiento</button>
    <button class="btn" id="addBtn">Nuevo ejercicio</button>
    <button class="btn" id="printBtn">Imprimir semana</button>
    <button class="btn" id="clearBtn">Vaciar semana</button>
  </div>
</header>
<div id="viewHome" class="view home"></div>
<div id="viewStudents" class="view" hidden></div>
<div id="viewStats" class="view" hidden></div>
<div id="viewLib" class="view" hidden></div>
<div id="viewTrain" class="view" hidden></div>
<div id="viewTeam" class="view" hidden></div>
<div id="viewBoard" class="view" hidden></div>
<div class="layout view" id="viewPlan" hidden>
  <aside>
    <h2>Biblioteca de ejercicios</h2>
    <input class="search" id="q" type="search" placeholder="Buscar por nombre u objetivo" aria-label="Buscar ejercicio">
    <div id="lib"></div>
  </aside>
  <main>
    <div class="bar"><input id="title" value="Semana de clases" aria-label="Nombre de la semana"></div>
    <div class="wk"><button class="btn" id="wkPrev">Semana anterior</button><button class="btn" id="wkToday">Esta semana</button><button class="btn" id="wkNext">Semana siguiente</button><b id="wkRange"></b></div>
    <div class="board" id="board"></div>
  </main>
</div>

</div>
<dialog id="viewDlg"><div id="viewBody"></div><form method="dialog" class="actions"><button class="btn">Cerrar</button></form></dialog>

<dialog id="addDlg">
  <h2>Nuevo ejercicio</h2>
  <form id="addForm">
    <label for="fCat">Categoría</label>
    <input id="fCat" list="cats" required placeholder="Ej.: Técnica, Táctica, Físico">
    <datalist id="cats"></datalist>
    <label for="fIco">Icono (si no subes imagen)</label>
    <select id="fIco"><option>🏓</option><option>🎯</option><option>⚡</option><option>↗️</option><option>🔁</option><option>💥</option><option>🧱</option><option>🏃</option><option>🎾</option></select>
    <label for="fName">Nombre</label>
    <input id="fName" required>
    <label for="fObj">Objetivo</label>
    <input id="fObj" required>
    <label for="fDesc">Descripción</label>
    <textarea id="fDesc" rows="4" required></textarea>
    <label for="fImg">Diagrama (imagen, opcional)</label>
    <input id="fImg" type="file" accept="image/*">
    <button type="button" class="btn" id="drawBtn" style="margin-top:8px">Dibujar en pista</button>
    <img class="pv" id="pv" alt="Vista previa">
    <div class="actions"><button type="button" class="btn" id="cancelAdd">Cancelar</button><button class="btn pri">Guardar ejercicio</button></div>
  </form>
</dialog>

<script>

function renderLib(){
  const q=$("q").value.trim().toLowerCase();
  const cats=[...new Set(BASE_CATS.concat(all().map(e=>e.cat)))];
  $("cats").innerHTML=cats.map(c=>`<option value="${esc(c)}">`).join("");
  const searching=q.length>0;
  $("lib").innerHTML=cats.map(c=>{
    const list=all().filter(e=>e.cat===c&&(!q||(e.name+" "+e.obj).toLowerCase().includes(q)));
    if(searching&&!list.length)return"";
    const items=list.length?list.map(e=>`<div class="ex" draggable="true" data-id="${esc(e.id)}">${thumb(e)}<div><b>${esc(e.name)}</b><small>${esc(e.obj)}</small>

    return`<details ${list.length||searching?"open":""}><summary>${esc(c)}<span class="count">${list.length}</span></summary>${items}</details>`}).join("");

function renderBoard(){
  const t=todayISO(),ds=weekDates();

    const p=plan[iso]||{items:[]},d=DAYS[i];
    const ss=(p.sess||[]).map((s,k)=>({...s,k})).sort((a,b)=>a.time.localeCompare(b.time)).map(s=>`<div class="session" style="--gc:${gcol(s.group)}"><span>${s.time} · ${esc(s.duration)}</span>${esc(s.name)}<small>${esc(s.group)}</small><button data-rms="${iso}|${s.k}" aria-label="Quitar sesión">×</button></div>`).join("");
    const slots=p.items.length?p.items.map((it,k)=>{const e=byId(it);if(!e)return"";
      return`<div class="slot">${thumb(e)}<span data-view="${esc(e.id)}">${esc(e.name)}</span><button data-rm="${iso}|${k}" aria-label="Quitar ${esc(e.name)}">×</button></div>`}).join(""):`<p class="hint">Arrastra aquí un ejercicio</p>`;

 const g=items.map(i=>{
  if(i.t==="arrow"){const a=Math.atan2(i.y2-i.y1,i.x2-i.x1),L=22,W=12,bx=i.x2-Math.cos(a)*L,by=i.y2-Math.sin(a)*L,px=-Math.sin(a)*W,py=Math.cos(a)*W;
   return `<path d="M${i.x1} ${i.y1}L${bx} ${by}" stroke="#ffe600" stroke-width="6" stroke-linecap="round"/><polygon points="${i.x2},${i.y2} ${bx+px},${by+py} ${bx-px},${by-py}" fill="#ffe600"/>`}
  return `<use href="#${i.t}" transform="translate(${i.x} ${i.y})${i.t==="cone"?" scale(1.2)":""}"/>`}).join("");
 return `<svg ${full?'xmlns="http://www.w3.org/2000/svg" ':''}viewBox="0 0 600 940"><defs><pattern id="mesh" width="10" height="8" patternUnits="userSpaceOnUse"><path d="M0 0H10M0 4H10M5 0V8" stroke="#6f9be0" stroke-width="1" opacity=".55"/></pattern><g id="cone"><ellipse cy="14" rx="17" ry="5" fill="#d9531a"/><polygon points="-12,14 0,-18 12,14" fill="#ff7a1a"/><polygon points="-8,3 8,3 5,-6 -5,-6" fill="#fff" opacity=".92"/></g><g id="ball"><circle r="14" fill="#c8e63a" stroke="#8faa1f" stroke-width="2"/><path d="M-11 -8Q-2 0 -11 8M11 -8Q2 0 11 8" fill="none" stroke="#fff" stroke-width="2"/></g><g id="player" fill="none" stroke="#c026d3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cy="-24" r="6" fill="#c026d3"/><path d="M0 -15V6M0 6L-9 24M0 6L9 24M0 -9L14 -17"/><ellipse cx="21" cy="-25" rx="6" ry="8" stroke-width="3"/></g></defs><rect x="20" y="20" width="560" height="880" rx="16" fill="#0b5ad9" stroke="#083a8c" stroke-width="10"/><g stroke="#fff" stroke-width="4" stroke-linecap="round"><path d="M20 215H580M20 745H580M300 215V466M300 500V745"/></g><rect x="20" y="468" width="560" height="32" fill="#0a3d8f"/><rect x="20" y="468" width="560" height="32" fill="url(#mesh)"/><path d="M20 466H580" stroke="#fff" stroke-width="5"/>${g}</svg>`}

$("edBoard").addEventListener("pointerdown",ev=>{ev.preventDefault();const p=edPt(ev);
 if(ED.tool==="arrow"){ED.drag={x1:p.x,y1:p.y,x2:p.x,y2:p.y};$("edBoard").setPointerCapture(ev.pointerId)}
 else if(ED.tool==="erase"){let k=-1,best=40;ED.items.forEach((i,n)=>{const pts=i.t==="arrow"?[[i.x1,i.y1],[i.x2,i.y2],[(i.x1+i.x2)/2,(i.y1+i.y2)/2]]:[[i.x,i.y]];pts.forEach(q=>{const d=Math.hypot(q[0]-p.x,q[1]-p.y);if(d<best){best=d;k=n}})});if(k>=0)ED.items.splice(k,1);edRender()}
 else{ED.items.push({t:ED.tool,x:p.x,y:p.y});edRender()}
 if(ED.drag)edRender()});

const pzSnap=()=>{PZ.hist.push(JSON.stringify(PZ.items));if(PZ.hist.length>40)PZ.hist.shift()};
const pzTool=t=>{PZ.tool=t;document.querySelectorAll("#pzTools [data-pz]").forEach(b=>b.classList.toggle("on",b.dataset.pz==="tool|"+t));$("pzBoard").style.cursor=t==="mov"?"default":"crosshair"};
const pzMove=(i,o,dx,dy)=>{if(i.t==="arr"){i.x1=o.x1+dx;i.y1=o.y1+dy;i.x2=o.x2+dx;i.y2=o.y2+dy}else if(i.t==="pen")i.pts=o.pts.map(q=>[q[0]+dx,q[1]+dy]);else{i.x=o.x+dx;i.y=o.y+dy}};
const pzList=()=>{$("pzCount").textContent=plays.length;$("pzList").innerHTML=plays.map(p=>`<div class="listitem" style="cursor:pointer" data-pz="open|${p.id}"><div><b>${esc(p.name)}</b><div class="sub">${dnum(p.d)}</div></div><button class="ghost" data-pz="rm|${p.id}" aria-label="Eliminar">×</button></div>`).join("")||'<p class="empty">Aún no has guardado jugadas.</p>'};
const pzRefresh=()=>{pzRender();pzList();pzTool(PZ.tool)};
function pzSave(){const nm=$("pzName").value.trim()||"Jugada sin nombre",o={id:PZ.id||"j"+Date.now(),name:nm,items:JSON.parse(JSON.stringify(PZ.items)),d:todayISO()};PZ.id=o.id;plays=plays.some(x=>x.id===o.id)?plays.map(x=>x.id===o.id?o:x):plays.concat(o);save()}
function pzPng(){PZ.sel=-1;pzRender();const W=PZ.rot?600:1100,H=PZ.rot?1100:600,svg=$("pzBoard").innerHTML.replace("<svg ",'<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" '),im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=W;c.height=H;c.getContext("2d").drawImage(im,0,0);const a=document.createElement("a");a.href=c.toDataURL("image/png");a.download=($("pzName").value.trim()||"jugada")+".png";a.click()};im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)}
$("viewBoard").innerHTML=`<div class="pz"><section class="panel"><div class="bar"><input id="pzName" value="Jugada nueva" aria-label="Nombre de la jugada"><button class="btn pri" data-pz="save">Guardar jugada</button><button class="btn" data-pz="new">Nueva</button><button class="btn" data-pz="rot">⟳ Girar pizarra</button><button class="btn" data-pz="png">Descargar imagen</button></div>
<div class="pz-tools" id="pzTools"><button class="btn on" data-pz="tool|mov">Mover</button><button class="btn" data-pz="tool|arr">Flecha de movimiento</button><button class="btn" data-pz="tool|shot">Flecha de golpe</button><button class="btn" data-pz="tool|pen">Lápiz</button><button class="btn" data-pz="tool|txt">Texto</button><button class="btn" data-pz="tool|era">Goma</button></div>
<div id="pzBoard"></div>
<div class="pz-tools" style="margin:10px 0 6px"><button class="btn" data-pz="add|A">＋ Jugador verde</button><button class="btn" data-pz="add|B">＋ Jugador rojo</button><button class="btn" data-pz="add|ball">＋ Bola</button><button class="btn" data-pz="undo">Deshacer</button><button class="btn" data-pz="del">Borrar selección</button><button class="btn" data-pz="ren">Renombrar</button></div>
<p class="sub">Arrastra fichas, flechas o trazos con Mover. Al seleccionar una flecha puedes mover sus extremos. Doble toque (o el botón Renombrar) cambia el nombre de una ficha o texto.</p></section>
<section class="panel"><div class="heading"><h2>Jugadas guardadas</h2><span class="pl" id="pzCount">0</span></div><div id="pzList"></div></section></div>`;
const pzUp=()=>{const m=PZ.tmp;PZ.drag=null;if(m){PZ.tmp=null;if(m.t==="pen"?m.pts.length>2:Math.hypot(m.x2-m.x1,m.y2-m.y1)>20){pzSnap();PZ.items.push(m);PZ.sel=PZ.items.length-1}}pzRender()};
$("pzBoard").addEventListener("pointerdown",ev=>{ev.preventDefault();const p=pzPt(ev),h=ev.target.closest("[data-i]"),n=h?+h.dataset.i:-1,t=PZ.tool,B=$("pzBoard");
 if(t==="mov"){PZ.sel=n;if(n>=0){PZ.drag={n,p,h:ev.target.dataset.h||"",o:JSON.parse(JSON.stringify(PZ.items[n]))};B.setPointerCapture(ev.pointerId)}}
 else if(t==="era"){if(n>=0){pzSnap();PZ.items.splice(n,1)}PZ.sel=-1}
 else if(t==="txt"){const s=prompt("Texto:");if(s){pzSnap();PZ.items.push({t:"text",x:p[0],y:p[1],s});PZ.sel=PZ.items.length-1}pzTool("mov")}
 else{PZ.sel=-1;PZ.tmp=t==="pen"?{t:"pen",pts:[p]}:{t:"arr",k:t==="shot"?"g":"m",x1:p[0],y1:p[1],x2:p[0],y2:p[1]};B.setPointerCapture(ev.pointerId)}
 pzRender()});
$("pzBoard").addEventListener("pointermove",ev=>{const p=pzPt(ev),d=PZ.drag;
 if(d){if(!d.m){pzSnap();d.m=1}const i=PZ.items[d.n],o=d.o,dx=p[0]-d.p[0],dy=p[1]-d.p[1];
  if(d.h==="1"){i.x1=o.x1+dx;i.y1=o.y1+dy}else if(d.h==="2"){i.x2=o.x2+dx;i.y2=o.y2+dy}else pzMove(i,o,dx,dy)}
 else if(PZ.tmp){if(PZ.tmp.t==="pen")PZ.tmp.pts.push(p);else{PZ.tmp.x2=p[0];PZ.tmp.y2=p[1]}}else return;
 pzRender()});
$("pzBoard").addEventListener("pointerup",pzUp);$("pzBoard").addEventListener("pointercancel",pzUp);
$("pzBoard").addEventListener("dblclick",ev=>{const h=ev.target.closest("[data-i]");if(!h)return;const i=PZ.items[+h.dataset.i];
 if(i.t==="p"){const s=prompt("Nombre o número del jugador:",i.l);if(s!==null){pzSnap();i.l=s.slice(0,5)}}else if(i.t==="text"){const s=prompt("Texto:",i.s);if(s!==null){pzSnap();i.s=s}}
 pzRender()});
$("viewBoard").addEventListener("click",ev=>{const b=ev.target.closest("[data-pz]");if(!b)return;const[a,k]=b.dataset.pz.split("|");
 if(a==="tool")return pzTool(k);
 if(a==="add"){pzSnap();const c=PZ.items.filter(i=>i.t==="p"&&i.k===k).length;PZ.items.push(k==="ball"?{t:"ball",x:550,y:300}:{t:"p",k,l:String(c+1),x:k==="A"?300:800,y:300});PZ.sel=PZ.items.length-1}
 else if(a==="undo"){if(PZ.hist.length){PZ.items=JSON.parse(PZ.hist.pop());PZ.sel=-1}}
 else if(a==="del"){if(PZ.sel>=0){pzSnap();PZ.items.splice(PZ.sel,1);PZ.sel=-1}}
 else if(a==="new"){PZ.id=null;PZ.items=pzNew();PZ.sel=-1;PZ.hist=[];$("pzName").value="Jugada nueva"}
 else if(a==="rot")PZ.rot=!PZ.rot;
 else if(a==="ren"){const i=PZ.items[PZ.sel];if(i&&i.t==="p"){const s=prompt("Nombre o número del jugador:",i.l);if(s!==null){pzSnap();i.l=s.slice(0,5)}}else if(i&&i.t==="text"){const s=prompt("Texto:",i.s);if(s!==null){pzSnap();i.s=s}}}
 else if(a==="save")pzSave();
 else if(a==="png")return pzPng();
 else if(a==="open"){const p=plays.find(x=>x.id===k);if(p){PZ.id=p.id;PZ.items=JSON.parse(JSON.stringify(p.items));PZ.sel=-1;PZ.hist=[];$("pzName").value=p.name}}
 else if(a==="rm"){if(!confirm("¿Eliminar esta jugada?"))return;plays=plays.filter(x=>x.id!==k);if(PZ.id===k)PZ.id=null;save()}
 pzRefresh()});
document.addEventListener("keydown",ev=>{if(view==="Board"&&PZ.sel>=0&&(ev.key==="Delete"||ev.key==="Backspace")&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ev.preventDefault();pzSnap();PZ.items.splice(PZ.sel,1);PZ.sel=-1;pzRender()}});
tick();setInterval(tick,15000);
$("title").value=title;
renderLib();renderBoard();go("Home");
</script>
</body>
</html>
